name: CodeAssist AKRO Build

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache Composite Builds
        uses: actions/cache@v4
        with:
          path: |
            composite-builds/.gradle
            composite-builds/build-logic/.gradle
            tooling/.gradle
          key: ${{ runner.os }}-composite-${{ hashFiles('composite-builds/**/*.gradle*', 'tooling/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-composite-

      - name: Build Debug APK
        id: build
        run: |
          ./gradlew :ide-android:assembleDebug \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            2>&1 | tee build_output.txt
          exit ${PIPESTATUS[0]}

      - name: Build Release APK
        if: success()
        run: |
          ./gradlew :ide-android:assembleRelease \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            2>&1 | tee -a build_output.txt

      - name: Generate Failure Report
        if: failure()
        run: |
          python3 << 'EOF'
          import re
          from datetime import datetime

          def read(p):
              try:
                  with open(p, 'r', errors='ignore') as f: return f.read()
              except: return ""

          build_log = read("build_output.txt")
          now = datetime.now().strftime("%Y-%m-%d %H:%M:%S")

          lines = build_log.split('\n')
          error_keywords = [
              'error:', 'fatal error:', 'FAILED', 'Exception', 'Could not',
              'not found', 'Caused by:', 'BUILD FAILED', 'Unresolved reference',
              'None of the following', 'Overload resolution ambiguity'
          ]

          errors = []
          for i, line in enumerate(lines):
              if any(k in line for k in error_keywords):
                  start = max(0, i - 2)
                  end = min(len(lines), i + 8)
                  block = '\n'.join(lines[start:end])
                  if block not in errors:
                      errors.append(block)

          kotlin_errors = re.findall(r'([^\s]+\.kt):(\d+):\d+: (?:error|warning): (.+)', build_log)
          failed_tasks = re.findall(r'> Task (.+?) FAILED', build_log)

          report = []
          report.append("=" * 70)
          report.append("  CODEASSIST AKRO - BUILD FAILURE REPORT")
          report.append(f"  Date: {now}")
          report.append("=" * 70)

          report.append("\n[ FAILED TASKS ]")
          report.append("-" * 70)
          if failed_tasks:
              for t in set(failed_tasks):
                  report.append(f"  x {t}")
          else:
              report.append("  No specific tasks found")

          report.append("\n[ KOTLIN/JAVA ERRORS ]")
          report.append("-" * 70)
          if kotlin_errors:
              seen = set()
              for file, line, msg in kotlin_errors[:20]:
                  key = f"{file}:{line}"
                  if key not in seen:
                      seen.add(key)
                      report.append(f"  File : {file}")
                      report.append(f"  Line : {line}")
                      report.append(f"  Error: {msg.strip()}")
                      report.append("")
          else:
              report.append("  No Kotlin/Java errors found")

          report.append("\n[ FULL ERROR BLOCKS ]")
          report.append("-" * 70)
          if errors:
              for i, err in enumerate(errors[:20], 1):
                  report.append(f"\n--- Error #{i} ---")
                  report.append(err)
          else:
              report.append("  No error blocks found")

          report.append("\n[ FULL BUILD LOG ]")
          report.append("-" * 70)
          report.append(build_log[-30000:])  # last 30k chars

          report_text = '\n'.join(report)
          with open("BUILD_FAILURE_REPORT.txt", 'w') as f:
              f.write(report_text)

          print(report_text[:3000])
          print(f"\n  Full report saved to BUILD_FAILURE_REPORT.txt")
          EOF

      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BUILD-FAILURE-REPORT-${{ github.run_number }}
          path: BUILD_FAILURE_REPORT.txt
          retention-days: 30

      - name: Sign Release APK
        if: success() && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          UNSIGNED=$(find ide-android/build/outputs/apk/release -name "*unsigned*.apk" | head -1)
          if [ -n "$UNSIGNED" ]; then
            $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
              --ks release.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$STORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out ide-android/build/outputs/apk/release/codeassist-release-signed.apk \
              "$UNSIGNED"
            echo "APK signed successfully"
          fi
          rm -f release.jks

      - name: Get version info
        if: success()
        id: version
        run: |
          # Try to read version from version.properties
          if [ -f "version.properties" ]; then
            VERSION=$(grep -i "version" version.properties | head -1 | cut -d'=' -f2 | tr -d ' \r')
          fi
          # Fallback to build.gradle
          if [ -z "$VERSION" ]; then
            VERSION=$(grep "versionName" ide-android/build.gradle.kts 2>/dev/null | \
              grep -o '"[^"]*"' | tr -d '"' | head -1)
          fi
          VERSION=${VERSION:-1.0.0}
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodeAssist-AKRO-Debug-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_date }}
          path: ide-android/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodeAssist-AKRO-Release-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.build_date }}
          path: |
            ide-android/build/outputs/apk/release/*-unsigned.apk
            ide-android/build/outputs/apk/release/*-signed.apk
          retention-days: 30

      - name: Create GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: CodeAssist AKRO v${{ steps.version.outputs.version_name }}
          body: |
            ## CodeAssist AKRO v${{ steps.version.outputs.version_name }}
            - **Date:** ${{ steps.version.outputs.build_date }}
            - **Developer:** @A_KOJO
            - **Contact:** 01508294415
          files: |
            ide-android/build/outputs/apk/debug/*.apk
            ide-android/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
